basePath: /
definitions:
  entity.AdminStats:
    properties:
      by_role:
        additionalProperties:
          type: integer
        type: object
      total_users:
        type: integer
    type: object
  entity.Playlist:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_queue:
        type: boolean
      owner_id:
        type: string
      title:
        type: string
      track_count:
        description: maintenu par trigger BDD (migration 005)
        type: integer
      tracks:
        items:
          $ref: '#/definitions/entity.Track'
        type: array
    type: object
  entity.Stream:
    properties:
      active_session_id:
        type: string
      broadcaster_id:
        type: string
      ended_at:
        type: string
      id:
        type: string
      listener_count:
        type: integer
      started_at:
        type: string
      status:
        $ref: '#/definitions/entity.StreamStatus'
      title:
        type: string
    type: object
  entity.StreamStatus:
    enum:
    - live
    - ended
    type: string
    x-enum-varnames:
    - StreamStatusLive
    - StreamStatusEnded
  entity.Track:
    properties:
      added_at:
        type: string
      artist:
        type: string
      created_at:
        type: string
      duration:
        description: secondes
        type: integer
      file_url:
        description: URL Supabase Storage
        type: string
      id:
        type: string
      playlist_id:
        description: Champs de liaison playlist (remplis quand la track est dans une
          playlist)
        type: string
      position:
        type: integer
      title:
        type: string
      uploaded_by:
        type: string
    type: object
  entity.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      role:
        $ref: '#/definitions/entity.UserRole'
      suspended_at:
        type: string
    type: object
  entity.UserRole:
    enum:
    - anon
    - user
    - diffuseur
    - admin
    type: string
    x-enum-varnames:
    - RoleAnon
    - RoleUser
    - RoleDiffuseur
    - RoleAdmin
  handler.AddFavoriteRequest:
    properties:
      stream_id:
        type: string
    required:
    - stream_id
    type: object
  handler.AddTrackRequest:
    properties:
      track_id:
        type: string
    required:
    - track_id
    type: object
  handler.ChangePasswordRequest:
    properties:
      current_password:
        minLength: 8
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  handler.CreatePlaylistRequest:
    properties:
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - title
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
      role:
        type: string
    required:
    - email
    - password
    type: object
  handler.ReorderRequest:
    properties:
      track_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - track_ids
    type: object
  handler.StartRequest:
    properties:
      title:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - title
    type: object
  handler.UpdatePlaylistRequest:
    properties:
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - title
    type: object
  handler.UpdateRoleRequest:
    properties:
      role:
        $ref: '#/definitions/entity.UserRole'
    required:
    - role
    type: object
host: localhost:8080
info:
  contact:
    name: StreamPulse team
    url: https://github.com/Ghost-15/streaming
  description: |-
    Live audio streaming API. A broadcaster ingests an audio
    stream, the Hub fans it out to every listener, and playlists,
    favorites and listening history are exposed as REST resources.
  license:
    name: Educational project
  termsOfService: https://github.com/Ghost-15/streaming
  title: StreamPulse API
  version: "1.0"
paths:
  /api/v1/admin/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AdminStats'
      summary: Get admin statistics
      tags:
      - admin
  /api/v1/admin/users:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List all users (paginated)
      tags:
      - admin
  /api/v1/admin/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a user account
      tags:
      - admin
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.User'
      summary: Get user by ID
      tags:
      - admin
  /api/v1/admin/users/{id}/role:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: New role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update user role
      tags:
      - admin
  /api/v1/admin/users/{id}/suspend:
    post:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: true to suspend, false to reactivate
        in: query
        name: suspend
        required: true
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Suspend or reactivate a user account
      tags:
      - admin
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate and receive a JWT token
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Logout payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Revoke a refresh token
      tags:
      - auth
  /api/v1/auth/me:
    delete:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete the authenticated account (RGPD right to erasure)
      tags:
      - auth
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Return the authenticated user
      tags:
      - auth
  /api/v1/auth/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: Password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Change the password of the authenticated user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Exchange a refresh token for a new token pair
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /api/v1/favorites:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/entity.Track'
              type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the favorites of the authenticated user
      tags:
      - favorites
    post:
      consumes:
      - application/json
      parameters:
      - description: Favorite payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AddFavoriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a live stream to the favorites
      tags:
      - favorites
  /api/v1/favorites/{streamID}:
    delete:
      parameters:
      - description: Stream ID
        in: path
        name: streamID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a live stream from the favorites
      tags:
      - favorites
  /api/v1/playlists:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Playlist'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List playlists owned by the authenticated user
      tags:
      - playlists
    post:
      consumes:
      - application/json
      parameters:
      - description: Playlist payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreatePlaylistRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Playlist'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new playlist
      tags:
      - playlists
  /api/v1/playlists/{id}:
    delete:
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a playlist
      tags:
      - playlists
    get:
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Playlist'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a playlist by ID
      tags:
      - playlists
    put:
      consumes:
      - application/json
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdatePlaylistRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Playlist'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a playlist title
      tags:
      - playlists
  /api/v1/playlists/{id}/next:
    post:
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Track'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pop the next track of a playlist queue
      tags:
      - playlists
  /api/v1/playlists/{id}/tracks:
    post:
      consumes:
      - application/json
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      - description: Track payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AddTrackRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a track to a playlist
      tags:
      - playlists
  /api/v1/playlists/{id}/tracks/{trackID}:
    delete:
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      - description: Track ID
        in: path
        name: trackID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a track from a playlist
      tags:
      - playlists
  /api/v1/playlists/{id}/tracks/reorder:
    put:
      consumes:
      - application/json
      parameters:
      - description: Playlist ID
        in: path
        name: id
        required: true
        type: string
      - description: Ordered track IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ReorderRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reorder the queue of a playlist
      tags:
      - playlists
  /api/v1/recommendations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Stream'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Personalised live-stream recommendations
      tags:
      - recommendations
  /api/v1/streams:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Stream'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List every stream currently live
      tags:
      - streams
    post:
      consumes:
      - application/json
      parameters:
      - description: Stream payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.StartRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Stream'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a live stream
      tags:
      - streams
  /api/v1/streams/{id}:
    delete:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a stream owned by the broadcaster
      tags:
      - streams
  /api/v1/streams/{id}/audio:
    get:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Chunked audio bytes
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream the live audio publicly
      tags:
      - streams
    put:
      consumes:
      - application/octet-stream
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "408":
          description: Request Timeout
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "415":
          description: Unsupported Media Type
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ingest a continuous audio stream from the owner
      tags:
      - streams
  /api/v1/streams/{id}/audio/ws:
    get:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching protocols
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream the live audio over a WebSocket
      tags:
      - streams
  /api/v1/streams/{id}/leave:
    post:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record that the user left a stream
      tags:
      - streams
