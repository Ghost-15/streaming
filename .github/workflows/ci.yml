name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  GOTOOLCHAIN: local
  # Coverage gate enforced at 80% (mock helper packages excluded from the measure).
  COVERAGE_MIN: "80"

jobs:
  observability-config:
    name: Observability configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate dashboard JSON
        run: |
          jq empty go/infra/grafana/dashboards/streampulse.json
      - name: Validate Prometheus configuration and alerts
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/go/infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/go/infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/go/infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/alerts.yml

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: go

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum
      - name: Run tests with race detector and coverage
        working-directory: go
        # Exclude mock helper packages from the coverage measurement.
        run: go test $(go list ./... | grep -v '/mock$') -race -coverprofile=coverage.out -covermode=atomic
      - name: Report coverage
        id: coverage
        working-directory: go
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Go total coverage: ${TOTAL}%"
          echo "go_total=${TOTAL}" >> "$GITHUB_OUTPUT"
      - name: Coverage gate
        working-directory: go
        run: |
          TOTAL="${{ steps.coverage.outputs.go_total }}"
          MIN="${COVERAGE_MIN:-0}"
          awk -v total="$TOTAL" -v min="$MIN" 'BEGIN {
            if (min+0 <= 0) {
              printf "Coverage gate disabled. Set COVERAGE_MIN=80 to enforce. Current: %.1f%%\n", total
              exit 0
            }
            if (total+0 < min+0) {
              printf "Coverage below %.1f%%: %.1f%%\n", min, total
              exit 1
            }
            printf "Coverage OK: %.1f%% >= %.1f%%\n", total, min
          }'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: go/coverage.out

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: [go-lint, go-test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum
      - name: Build binary
        working-directory: go
        run: CGO_ENABLED=0 go build -ldflags='-w -s' -o bin/streampulse ./cmd/server
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: ./go
          push: false
          tags: streampulse-api:${{ github.sha }}

  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze
        working-directory: flutter
        run: flutter analyze
      - name: Run tests
        working-directory: flutter
        run: flutter test
      - name: Build web
        working-directory: flutter
        run: flutter build web --release
