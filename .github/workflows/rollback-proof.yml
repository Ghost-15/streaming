name: Render rollback proof

on:
  workflow_dispatch:
    inputs:
      target_deploy_id:
        description: Previous healthy Render deploy ID
        required: true
        type: string
      confirm:
        description: Type ROLLBACK_AND_RESTORE to accept a temporary production rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: streampulse-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back, prove, and restore production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate and capture current deployment
        id: before
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET_DEPLOY_ID: ${{ inputs.target_deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "ROLLBACK_AND_RESTORE" ]] || {
            echo "Confirmation must equal ROLLBACK_AND_RESTORE" >&2
            exit 1
          }
          : "${RENDER_API_KEY:?Missing RENDER_API_KEY secret}"
          : "${RENDER_SERVICE_ID:?Missing RENDER_SERVICE_ID variable}"
          live="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?status=live&limit=1")"
          current="$(jq -cer '.[0].deploy' <<<"$live")"
          current_id="$(jq -er '.id' <<<"$current")"
          current_ref="$(jq -er '.image.ref' <<<"$current")"
          current_digest="$(jq -er '.image.sha' <<<"$current")"
          [[ "$current_id" != "$TARGET_DEPLOY_ID" ]] || {
            echo "Target deploy is already live" >&2
            exit 1
          }
          target="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${TARGET_DEPLOY_ID}")"
          target_digest="$(jq -er '.image.sha' <<<"$target")"
          echo "current-ref=${current_ref}" >>"$GITHUB_OUTPUT"
          echo "current-digest=${current_digest}" >>"$GITHUB_OUTPUT"
          echo "target-digest=${target_digest}" >>"$GITHUB_OUTPUT"
      - name: Trigger rollback
        id: rollback
        env:
          TARGET_DEPLOY_ID: ${{ inputs.target_deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -nc --arg deployId "$TARGET_DEPLOY_ID" '{deployId: $deployId}')" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/rollback")"
          echo "deploy-id=$(jq -er '.id' <<<"$response")" >>"$GITHUB_OUTPUT"
      - name: Prove rolled-back version
        id: prove_rollback
        continue-on-error: true
        env:
          PRODUCTION_ORIGIN: https://${{ vars.API_DOMAIN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.rollback.outputs.deploy-id }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.before.outputs.target-digest }}
          EVIDENCE_DIR: rollback-evidence
        run: bash scripts/prove-production.sh
      - name: Restore version active before the test
        if: always() && steps.rollback.outputs.deploy-id != ''
        id: restore
        env:
          CURRENT_IMAGE_REF: ${{ steps.before.outputs.current-ref }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -nc --arg imageUrl "$CURRENT_IMAGE_REF" '{imageUrl: $imageUrl}')" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")"
          echo "deploy-id=$(jq -er '.id' <<<"$response")" >>"$GITHUB_OUTPUT"
      - name: Prove restored version
        if: always() && steps.restore.outputs.deploy-id != ''
        env:
          PRODUCTION_ORIGIN: https://${{ vars.API_DOMAIN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.restore.outputs.deploy-id }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.before.outputs.current-digest }}
          EVIDENCE_DIR: restore-evidence
        run: bash scripts/prove-production.sh
      - name: Upload rollback and restore evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollback-evidence-${{ github.run_id }}
          path: |
            rollback-evidence/
            restore-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Fail if rollback proof failed
        if: always() && steps.prove_rollback.outcome != 'success'
        run: exit 1
