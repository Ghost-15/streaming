name: Docker Hub publish and production deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "evidence/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streampulse-production
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  GOTOOLCHAIN: local
  FLUTTER_VERSION: "3.41.6"
  REGISTRY: docker.io

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum
      - name: Go tests and race detector
        working-directory: go
        run: go test ./... -race
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter quality gate
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --dart-define=API_BASE_URL=https://${{ vars.API_DOMAIN || 'api.example.com' }}/api/v1

  publish:
    name: Publish immutable image to Docker Hub
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image-digest: ${{ steps.runtime_image.outputs.digest }}
      image-index-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: ./go
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Resolve deployable Linux image digest
        id: runtime_image
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          IMAGE_INDEX_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DOCKERHUB_REPOSITORY:?Missing DOCKERHUB_REPOSITORY variable}"
          : "${IMAGE_INDEX_DIGEST:?Buildx did not return an image digest}"
          image="docker.io/${DOCKERHUB_REPOSITORY}@${IMAGE_INDEX_DIGEST}"
          manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')"
          runtime_digest="$(jq -er '
            if has("manifests") then
              [.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == "amd64" and
                (.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest"
              )]
              | if length == 1 then .[0].digest
                else error("expected exactly one linux/amd64 runtime manifest")
                end
            else
              .digest
            end
          ' <<<"$manifest")"
          [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Resolved runtime image digest is invalid: ${runtime_digest}" >&2
            exit 1
          }
          echo "Buildx OCI index: ${IMAGE_INDEX_DIGEST}"
          echo "Deployable linux/amd64 manifest: ${runtime_digest}"
          echo "digest=${runtime_digest}" >>"$GITHUB_OUTPUT"

  android-package:
    name: Package the Android application
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build the release APK
        working-directory: flutter
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://${{ vars.API_DOMAIN || 'api.example.com' }}/api/v1
      - name: Publish the APK as a release artifact
        uses: actions/upload-artifact@v7
        with:
          name: streampulse-android-${{ github.sha }}
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

  ios-package:
    name: Package the iOS application
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The project has no Apple signing identity, so the archive is produced
      # unsigned. The bundle is complete and inspectable; installing it on a
      # device would require an Apple Developer certificate.
      - name: Build the unsigned iOS bundle
        working-directory: flutter
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=https://${{ vars.API_DOMAIN || 'api.example.com' }}/api/v1
      - name: Assemble the unsigned IPA
        working-directory: flutter
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          [[ -d "$APP_PATH" ]] || {
            echo "::error::$APP_PATH is missing, the iOS build did not produce a bundle" >&2
            exit 1
          }
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry StreamPulse-unsigned.ipa Payload
          unzip -l StreamPulse-unsigned.ipa | tail -3
      - name: Publish the IPA as a release artifact
        uses: actions/upload-artifact@v7
        with:
          name: streampulse-ios-${{ github.sha }}
          path: flutter/build/ios/ipa/StreamPulse-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

  render-deploy:
    name: Deploy and prove Render production
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - name: Capture production version before deployment
        id: before
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Missing RENDER_API_KEY secret}"
          : "${RENDER_SERVICE_ID:?Missing RENDER_SERVICE_ID variable}"
          mkdir -p production-evidence
          live="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?status=live&limit=1")"
          current="$(jq -c '.[0].deploy // empty' <<<"$live")"
          if [[ -z "$current" ]]; then
            jq -nc \
              '{available: false, reason: "no-live-deployment", message: "First production deployment has no rollback target"}' \
              >production-evidence/before-deploy.json
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "deploy-id=" >>"$GITHUB_OUTPUT"
            echo "image-digest=" >>"$GITHUB_OUTPUT"
            echo "::notice::No live Render deployment exists yet; continuing without an automatic rollback target."
            exit 0
          fi
          current_id="$(jq -er '.id' <<<"$current")"
          current_digest="$(jq -er '.image.sha' <<<"$current")"
          jq '{available: true, id, status, trigger, createdAt, startedAt, finishedAt, image: (.image | {ref, sha})}' \
            <<<"$current" >production-evidence/before-deploy.json
          echo "available=true" >>"$GITHUB_OUTPUT"
          echo "deploy-id=${current_id}" >>"$GITHUB_OUTPUT"
          echo "image-digest=${current_digest}" >>"$GITHUB_OUTPUT"
      - name: Trigger immutable Render image deployment
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Missing RENDER_API_KEY secret}"
          : "${RENDER_SERVICE_ID:?Missing RENDER_SERVICE_ID variable}"
          : "${DOCKERHUB_REPOSITORY:?Missing DOCKERHUB_REPOSITORY variable}"
          image_url="docker.io/${DOCKERHUB_REPOSITORY}:${GITHUB_SHA}"
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -nc --arg imageUrl "$image_url" '{imageUrl: $imageUrl}')" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")"
          deploy_id="$(jq -er '.id' <<<"$response")"
          echo "deploy-id=${deploy_id}" >>"$GITHUB_OUTPUT"
      - name: Prove digest, application, HTTPS redirect and certificate
        id: production_proof
        continue-on-error: true
        env:
          PRODUCTION_ORIGIN: https://${{ vars.API_DOMAIN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.deploy-id }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
          EVIDENCE_DIR: production-evidence
        run: bash scripts/prove-production.sh
      - name: Restore previous production version after a critical proof failure
        id: automatic_rollback
        if: ${{ steps.production_proof.outcome == 'failure' && steps.before.outputs.available == 'true' }}
        env:
          FAILED_DEPLOY_ID: ${{ steps.render.outputs.deploy-id }}
          PREVIOUS_DEPLOY_ID: ${{ steps.before.outputs.deploy-id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FAILED_DEPLOY_ID:?Missing failed deployment ID}"
          : "${PREVIOUS_DEPLOY_ID:?Missing previous deployment ID}"
          failed="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${FAILED_DEPLOY_ID}")"
          failed_status="$(jq -er '.status' <<<"$failed")"
          live="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?status=live&limit=1")"
          live_id="$(jq -er '.[0].deploy.id' <<<"$live")"

          action=rollback
          case "$failed_status" in
            build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
              failed_before_activation=true
              ;;
            *)
              failed_before_activation=false
              ;;
          esac
          if [[ "$failed_before_activation" == true && "$live_id" == "$PREVIOUS_DEPLOY_ID" ]]; then
            # A terminal Render failure never replaced production, so there is
            # nothing to mutate. The proof step below still verifies the old
            # live deployment and its digest. A pending or live failed deploy
            # always takes the rollback branch to prevent later activation.
            recovery_deploy_id="$PREVIOUS_DEPLOY_ID"
            action=not-required
          else
            response="$(curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(jq -nc --arg deployId "$PREVIOUS_DEPLOY_ID" '{deployId: $deployId}')" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/rollback")"
            recovery_deploy_id="$(jq -er '.id' <<<"$response")"
          fi

          jq -nc \
            --arg action "$action" \
            --arg failedDeployId "$FAILED_DEPLOY_ID" \
            --arg failedStatus "$failed_status" \
            --arg liveDeployIdAtRecovery "$live_id" \
            --arg previousDeployId "$PREVIOUS_DEPLOY_ID" \
            --arg recoveryDeployId "$recovery_deploy_id" \
            '{action: $action, failedDeployId: $failedDeployId, failedStatus: $failedStatus, liveDeployIdAtRecovery: $liveDeployIdAtRecovery, previousDeployId: $previousDeployId, recoveryDeployId: $recoveryDeployId}' \
            >production-evidence/automatic-rollback.json
          echo "deploy-id=${recovery_deploy_id}" >>"$GITHUB_OUTPUT"
      - name: Prove previous production version was restored
        id: rollback_proof
        if: ${{ always() && steps.production_proof.outcome == 'failure' && steps.automatic_rollback.outputs.deploy-id != '' }}
        env:
          PRODUCTION_ORIGIN: https://${{ vars.API_DOMAIN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.automatic_rollback.outputs.deploy-id }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.before.outputs.image-digest }}
          EVIDENCE_DIR: production-evidence/automatic-rollback
        run: bash scripts/prove-production.sh
      - name: Prove production metrics, logs and traces
        id: observability_proof
        if: ${{ steps.production_proof.outcome == 'success' }}
        env:
          GRAFANA_PROMETHEUS_QUERY_URL: ${{ vars.GRAFANA_PROMETHEUS_QUERY_URL }}
          GRAFANA_PROMETHEUS_USERNAME: ${{ secrets.GRAFANA_PROMETHEUS_USERNAME }}
          GRAFANA_PROMETHEUS_API_KEY: ${{ secrets.GRAFANA_PROMETHEUS_API_KEY }}
          GRAFANA_LOKI_QUERY_URL: ${{ vars.GRAFANA_LOKI_QUERY_URL }}
          GRAFANA_LOKI_USERNAME: ${{ secrets.GRAFANA_LOKI_USERNAME }}
          GRAFANA_LOKI_API_KEY: ${{ secrets.GRAFANA_LOKI_API_KEY }}
          GRAFANA_TEMPO_QUERY_URL: ${{ vars.GRAFANA_TEMPO_QUERY_URL }}
          GRAFANA_TEMPO_USERNAME: ${{ secrets.GRAFANA_TEMPO_USERNAME }}
          GRAFANA_TEMPO_API_KEY: ${{ secrets.GRAFANA_TEMPO_API_KEY }}
          EVIDENCE_DIR: production-evidence/observability
        run: |
          # Allow the API's OTLP metrics and trace batch exporters to flush.
          sleep 45
          bash scripts/prove-observability.sh
      - name: Record production workflow outcomes
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.before.outcome }}
          DEPLOY_OUTCOME: ${{ steps.render.outcome }}
          PRODUCTION_PROOF_OUTCOME: ${{ steps.production_proof.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.automatic_rollback.outcome }}
          ROLLBACK_PROOF_OUTCOME: ${{ steps.rollback_proof.outcome }}
          OBSERVABILITY_PROOF_OUTCOME: ${{ steps.observability_proof.outcome }}
          PREVIOUS_DEPLOY_AVAILABLE: ${{ steps.before.outputs.available }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-evidence
          jq -nc \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg commitSha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg capture "$CAPTURE_OUTCOME" \
            --arg deploy "$DEPLOY_OUTCOME" \
            --arg productionProof "$PRODUCTION_PROOF_OUTCOME" \
            --arg automaticRollback "$ROLLBACK_OUTCOME" \
            --arg rollbackProof "$ROLLBACK_PROOF_OUTCOME" \
            --arg observabilityProof "$OBSERVABILITY_PROOF_OUTCOME" \
            --arg previousDeployAvailable "$PREVIOUS_DEPLOY_AVAILABLE" \
            '{timestamp: $timestamp, commitSha: $commitSha, runId: $runId, previousDeployAvailable: ($previousDeployAvailable == "true"), steps: {capture: $capture, deploy: $deploy, productionProof: $productionProof, automaticRollback: $automaticRollback, rollbackProof: $rollbackProof, observabilityProof: $observabilityProof}}' \
            >production-evidence/workflow-outcomes.json
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-evidence-${{ github.sha }}
          path: production-evidence/
          # Never hide the original deployment failure with a secondary
          # artifact error. workflow-outcomes.json should normally exist.
          if-no-files-found: warn
          retention-days: 90
      - name: Fail delivery after automatic rollback
        if: ${{ always() && steps.production_proof.outcome == 'failure' }}
        env:
          PREVIOUS_DEPLOY_AVAILABLE: ${{ steps.before.outputs.available }}
          ROLLBACK_OUTCOME: ${{ steps.automatic_rollback.outcome }}
          ROLLBACK_PROOF_OUTCOME: ${{ steps.rollback_proof.outcome }}
        run: |
          if [[ "$PREVIOUS_DEPLOY_AVAILABLE" != "true" ]]; then
            echo "::error::Critical production proof failed, but no previous live deployment existed for rollback."
          elif [[ "$ROLLBACK_OUTCOME" == "success" && "$ROLLBACK_PROOF_OUTCOME" == "success" ]]; then
            echo "::error::Critical production proof failed. The previous production version was restored and proved."
          else
            echo "::error::Critical production proof failed and restoration was not successfully proved. Manual intervention is required."
          fi
          exit 1
