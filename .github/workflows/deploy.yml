name: Docker Hub publish and production deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streampulse-production
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"
  GOTOOLCHAIN: local
  REGISTRY: docker.io

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum
      - name: Go tests and race detector
        working-directory: go
        run: go test ./... -race
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true
      - name: Flutter quality gate
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --dart-define=API_BASE_URL=https://${{ vars.API_DOMAIN || 'api.example.com' }}/api/v1

  publish:
    name: Publish immutable image to Docker Hub
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./go
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  render-deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Call Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          : "${RENDER_DEPLOY_HOOK_URL:?Missing RENDER_DEPLOY_HOOK_URL secret}"
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"
