name: Docker Hub publish and production deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streampulse-production
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"
  GOTOOLCHAIN: local
  REGISTRY: docker.io

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum
      - name: Go tests and race detector
        working-directory: go
        run: go test ./... -race
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true
      - name: Flutter quality gate
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --dart-define=API_BASE_URL=https://${{ vars.API_DOMAIN || 'api.example.com' }}/api/v1

  publish:
    name: Publish immutable image to Docker Hub
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./go
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  render-deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Call Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          : "${RENDER_DEPLOY_HOOK_URL:?Missing RENDER_DEPLOY_HOOK_URL secret}"
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

  deploy:
    name: Deploy and health-check
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ vars.ENABLE_VPS_DEPLOY == 'true' }}
    environment:
      name: production
      url: https://${{ vars.API_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build deployment bundle
        run: |
          tar -czf deployment-bundle.tgz \
            compose.prod.yml \
            deploy \
            go/infra/prometheus.yml \
            go/infra/prometheus/alerts.yml \
            go/infra/grafana
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload versioned configuration
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          ssh "$PROD_USER@$PROD_HOST" "mkdir -p '$PROD_PATH'"
          scp deployment-bundle.tgz "$PROD_USER@$PROD_HOST:$PROD_PATH/deployment-bundle.tgz"
          ssh "$PROD_USER@$PROD_HOST" \
            "cd '$PROD_PATH' && tar -xzf deployment-bundle.tgz && rm deployment-bundle.tgz"
      - name: Deploy with automatic rollback
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          ssh "$PROD_USER@$PROD_HOST" \
            "cd '$PROD_PATH' && chmod +x deploy/deploy.sh && IMAGE_REPOSITORY='$IMAGE_REPOSITORY' IMAGE_TAG='$IMAGE_TAG' ./deploy/deploy.sh"
